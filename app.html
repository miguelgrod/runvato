<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

    <title>Runvato</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>

        body {
            background: #000;
            margin: 0;
            overflow: hidden;
            position: relative;
            font-family: system-ui;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("img/bgimage.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.1;
            z-index: -1;
        }

        /* ---------- SLIDER STYLE ---------- */

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #2b2b2b;
            border-radius: 10px;
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 34px;
            height: 34px;
            background: #111;
            border: 3px solid #d7ff00;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(215, 255, 0, 0.6);
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 34px;
            height: 34px;
            background: #111;
            border: 3px solid #d7ff00;
            border-radius: 50%;
        }

        /* ---------- PROGRESS ---------- */

        #progressRing {
            transition: stroke-dashoffset 1s linear;
        }

        #progressTotal {
            transition: width 1s linear;
        }

        /* ---------- MOBILE HEIGHT FIT ---------- */

        .appContainer {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: 430px;
            margin: 0 auto;
        }

        .sliderBlock {
            margin-bottom: 1.2rem;
        }

        .sliderLabel {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            color: #ddd;
        }

        .sliderValue {
            color: #d7ff00;
            font-weight: 600;
        }

        /* ---------- RUNNING MODE ---------- */

        #slidersSection {
            transition: opacity 0.5s ease, max-height 0.5s ease, margin 0.5s ease;
            max-height: 400px;
            overflow: hidden;
        }

        body.running #slidersSection {
            opacity: 0;
            max-height: 0;
            margin: 0;
            pointer-events: none;
        }

        #timerWrapper {
            transition: width 0.5s ease, height 0.5s ease;
        }

        body.running #timerWrapper {
            width: 80vw;
            height: 80vw;
            max-width: 400px;
            max-height: 400px;
        }

        #timer {
            transition: font-size 0.5s ease;
        }

        body.running #timer {
            font-size: clamp(2.5rem, 10vw, 4rem);
        }

        /* ---------- AUTH INPUT ---------- */

        .auth-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 0.75rem;
            color: white;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .auth-input:focus {
            border-color: #d7ff00;
        }

        .auth-input::placeholder {
            color: #555;
        }

        .auth-input.input-ok    { border-color: #4ade80; }
        .auth-input.input-error { border-color: #f87171; }

    </style>

</head>

<body class="text-white">

    <!-- AUTH MODAL -->

    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black">

        <div class="w-full max-w-sm px-6 py-8 mx-4" style="background:#111; border-radius:1.25rem;">

            <h2 class="text-2xl font-bold mb-1 text-center">RUNVATO</h2>
            <p id="authSubtitle" class="text-center text-gray-400 text-sm mb-6">Inicia sesión para continuar</p>

            <div id="authMessage" class="hidden mb-4 text-sm text-center px-2 py-2 rounded-lg"></div>

            <input id="authEmail" type="email" placeholder="Email" class="auth-input mb-3">

            <div class="relative mb-5">
                <input id="authPassword" type="password" placeholder="Contraseña" class="auth-input">
                <div id="passwordTooltip" class="hidden absolute left-0 right-0 mt-2 px-3 py-2 rounded-lg text-xs" style="background:#1a1a1a; border:1px solid #333; top:100%; transition: border-color 0.2s;">
                    <p class="font-semibold mb-1" id="tooltipTitle" style="color:#aaa;">La contraseña debe tener:</p>
                    <ul class="space-y-0.5 list-none">
                        <li id="req-length" class="text-gray-400">○ Mínimo 6 caracteres</li>
                    </ul>
                </div>
            </div>

            <button id="authBtn" class="w-full bg-[#d7ff00] text-black py-3 rounded-full font-bold mb-4">
                ENTRAR
            </button>

            <p class="text-center text-sm text-gray-400">
                <span id="authToggleText">¿No tienes cuenta?</span>
                <button id="authToggle" class="text-[#d7ff00] ml-1 font-semibold">Regístrate</button>
            </p>

        </div>

    </div>

    <!-- APP -->

    <div class="appContainer w-full px-6 py-5">

        <!-- HEADER -->

        <div class="flex justify-between items-center">

            <h1 class="text-3xl font-bold">RUNVATO</h1>

            <div class="flex items-center gap-4">

                <button id="logoutBtn" title="Cerrar sesión" class="opacity-50 hover:opacity-100 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" viewBox="0 0 24 24">
                        <path d="M16 13v-2H7V8l-5 4 5 4v-3z"/>
                        <path d="M20 3h-9a2 2 0 0 0-2 2v4h2V5h9v14h-9v-4H9v4a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
                    </svg>
                </button>

                <div id="musicToggle" class="cursor-pointer">

                    <svg id="iconSoundOn" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 4V5L7 9H3z"/>
                    </svg>

                    <svg id="iconSoundOff" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" viewBox="0 0 24 24" class="hidden">
                        <path d="M3 9v6h4l5 4V5L7 9H3z"/>
                        <line x1="16" y1="8" x2="22" y2="16" stroke="white" stroke-width="2"/>
                        <line x1="22" y1="8" x2="16" y2="16" stroke="white" stroke-width="2"/>
                    </svg>

                </div>

            </div>

        </div>

        <!-- SLIDERS -->

        <div id="slidersSection">

            <div class="sliderBlock">

                <div class="sliderLabel">
                    <span>Caminar</span>
                    <span class="sliderValue"><span id="walkValue">1</span> min</span>
                </div>

                <input id="walkSlider" type="range" min="1" max="15" step="0.01" value="1" class="slider">

            </div>

            <div class="sliderBlock">

                <div class="sliderLabel">
                    <span>Correr</span>
                    <span class="sliderValue"><span id="runValue">3</span> min</span>
                </div>

                <input id="runSlider" type="range" min="1" max="15" step="0.01" value="3" class="slider">

            </div>

            <div class="sliderBlock">

                <div class="sliderLabel">
                    <span>Series</span>
                    <span class="sliderValue" id="cycleValue">5</span>
                </div>

                <input id="cycleSlider" type="range" min="1" max="10" step="0.01" value="5" class="slider">

            </div>

        </div>

        <!-- TIMER AREA -->

        <div class="flex flex-col items-center justify-center flex-1">

            <div id="timerWrapper" class="relative w-56 h-56 mb-4">

                <svg class="w-full h-full -rotate-90" viewBox="0 0 224 224">

                    <circle cx="112" cy="112" r="100" stroke="#1f2937" stroke-width="12" fill="transparent"/>

                    <circle id="progressRing"
                        cx="112"
                        cy="112"
                        r="100"
                        stroke="#d7ff00"
                        stroke-width="12"
                        fill="transparent"
                        stroke-linecap="round"
                        stroke-dasharray="628"
                        stroke-dashoffset="628"
                    />

                </svg>

                <div class="absolute inset-0 flex items-center justify-center">

                    <div class="text-5xl font-bold" id="timer">
                        00:00
                    </div>

                </div>

            </div>

            <div class="w-full bg-gray-700 h-2 rounded">
                <div id="progressTotal" class="bg-[#d7ff00] h-2 rounded" style="width:0%"></div>
            </div>

            <div id="cycleLabel" class="mt-3 text-gray-400">
                LISTO
            </div>

        </div>

        <!-- BUTTONS -->

        <div class="flex gap-4 pb-safe">

            <button id="playBtn"
                class="flex-1 bg-[#d7ff00] text-black py-4 rounded-full font-bold">
                EMPEZAR
            </button>

            <button id="pauseBtn"
                disabled
                class="flex-1 border border-gray-400 text-gray-400 py-4 rounded-full cursor-not-allowed">
                PAUSA
            </button>

        </div>

    </div>

    <!-- AUDIOS -->

    <audio id="playSound" src="audio/play.mp3"></audio>
    <audio id="warn10" src="audio/warn10.mp3"></audio>
    <audio id="warn3" src="audio/warn3.mp3"></audio>
    <audio id="halfRun" src="audio/halfRun.mp3"></audio>
    <audio id="finishRun" src="audio/finishRun.mp3"></audio>
    <audio id="completeSound" src="audio/trainingComplete.mp3"></audio>
    <audio id="music" src="audio/music.mp3" loop></audio>

    <script>

        // ─── SUPABASE ────────────────────────────────────────────────────────────

        const SUPABASE_URL  = "https://criayuvoihnadarffnvk.supabase.co"
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNyaWF5dXZvaWhuYWRhcmZmbnZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyNjAzOTIsImV4cCI6MjA4ODgzNjM5Mn0.5Qm4OEUftGMhrbhvB3rTF6Vsx86RPvp17mG75_ngpMQ"

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

        // ─── AUTH UI ─────────────────────────────────────────────────────────────

        const authModal       = document.getElementById("authModal")
        const authEmail       = document.getElementById("authEmail")
        const authPassword    = document.getElementById("authPassword")
        const authBtn         = document.getElementById("authBtn")
        const authToggle      = document.getElementById("authToggle")
        const authToggleText  = document.getElementById("authToggleText")
        const authSubtitle    = document.getElementById("authSubtitle")
        const authMessage     = document.getElementById("authMessage")
        const logoutBtn       = document.getElementById("logoutBtn")
        const passwordTooltip = document.getElementById("passwordTooltip")
        const tooltipTitle    = document.getElementById("tooltipTitle")
        const reqLength       = document.getElementById("req-length")

        let authMode = "login"

        function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) }
        function isValidPassword(v) { return v.length >= 6 }

        function setInputState(input, state) {
            input.classList.remove("input-ok", "input-error")
            if (state === "ok")    input.classList.add("input-ok")
            if (state === "error") input.classList.add("input-error")
        }

        function showMessage(msg, type) {
            authMessage.textContent = msg
            authMessage.className = "mb-4 text-sm text-center px-2 py-2 rounded-lg"
            if (type === "error")   authMessage.style.cssText = "background:#2d1515; color:#f87171; margin-bottom:1rem;"
            if (type === "success") authMessage.style.cssText = "background:#0f2d1a; color:#4ade80; margin-bottom:1rem;"
            if (type === "info")    authMessage.style.cssText = "background:#1a1f2d; color:#93c5fd; margin-bottom:1rem;"
            authMessage.classList.remove("hidden")
        }

        function hideMessage() { authMessage.classList.add("hidden") }

        function resetInputStates() {
            setInputState(authEmail, null)
            setInputState(authPassword, null)
        }

        // Email feedback (solo en registro)
        authEmail.oninput = () => {
            if (authMode !== "register") return
            const v = authEmail.value.trim()
            if (!v) { setInputState(authEmail, null); return }
            setInputState(authEmail, isValidEmail(v) ? "ok" : "error")
        }

        // Password tooltip y feedback
        authPassword.onfocus = () => {
            if (authMode === "register") passwordTooltip.classList.remove("hidden")
        }
        authPassword.onblur = () => {
            passwordTooltip.classList.add("hidden")
        }
        authPassword.oninput = () => {
            if (authMode !== "register") return
            const ok = isValidPassword(authPassword.value)
            reqLength.textContent = (ok ? "✓" : "○") + " Mínimo 6 caracteres"
            reqLength.style.color = ok ? "#4ade80" : "#f87171"
            tooltipTitle.style.color = ok ? "#4ade80" : "#f87171"
            passwordTooltip.style.borderColor = ok ? "#4ade80" : "#f87171"
            setInputState(authPassword, ok ? "ok" : "error")
        }

        authToggle.onclick = () => {
            authMode = authMode === "login" ? "register" : "login"
            hideMessage()
            passwordTooltip.classList.add("hidden")
            resetInputStates()
            authEmail.value = ""
            authPassword.value = ""
            if (authMode === "register") {
                authBtn.textContent        = "REGISTRARSE"
                authSubtitle.textContent   = "Crea tu cuenta gratis"
                authToggleText.textContent = "¿Ya tienes cuenta?"
                authToggle.textContent     = "Inicia sesión"
            } else {
                authBtn.textContent        = "ENTRAR"
                authSubtitle.textContent   = "Inicia sesión para continuar"
                authToggleText.textContent = "¿No tienes cuenta?"
                authToggle.textContent     = "Regístrate"
            }
        }

        authBtn.onclick = async () => {
            const email    = authEmail.value.trim()
            const password = authPassword.value

            if (!email || !password) {
                showMessage("Rellena email y contraseña", "error")
                if (!email)    setInputState(authEmail, "error")
                if (!password) setInputState(authPassword, "error")
                return
            }

            if (authMode === "register") {
                if (!isValidEmail(email)) {
                    showMessage("Introduce un email válido", "error")
                    setInputState(authEmail, "error")
                    return
                }
                if (!isValidPassword(password)) {
                    showMessage("La contraseña debe tener al menos 6 caracteres", "error")
                    setInputState(authPassword, "error")
                    return
                }
            }

            authBtn.textContent = "..."
            authBtn.disabled    = true
            hideMessage()

            let error

            if (authMode === "login") {
                const res = await sb.auth.signInWithPassword({ email, password })
                error = res.error
            } else {
                const res = await sb.auth.signUp({ email, password })
                error = res.error
            }

            authBtn.disabled    = false
            authBtn.textContent = authMode === "login" ? "ENTRAR" : "REGISTRARSE"

            if (error) {
                showMessage(translateError(error.message), "error")
                setInputState(authEmail, "error")
                setInputState(authPassword, "error")
            } else if (authMode === "register") {
                showMessage("✓ Registro completado — revisa tu email para confirmar la cuenta", "success")
                resetInputStates()
            }
        }

        logoutBtn.onclick = async () => {
            await sb.auth.signOut()
        }

        function translateError(msg) {
            if (msg.includes("Invalid login"))      return "Email o contraseña incorrectos"
            if (msg.includes("already registered")) return "Este email ya está registrado"
            if (msg.includes("Password should"))    return "La contraseña debe tener al menos 6 caracteres"
            if (msg.includes("valid email"))        return "Introduce un email válido"
            return msg
        }

        // ─── SESSION ─────────────────────────────────────────────────────────────

        sb.auth.onAuthStateChange((_event, session) => {
            if (session) {
                authModal.style.display = "none"
                loadSettings()
            } else {
                authModal.style.display = "flex"
            }
        })

        // ─── SETTINGS ────────────────────────────────────────────────────────────

        async function loadSettings() {
            const { data } = await sb.from("settings").select().single()
            if (data) {
                walkSlider.value = data.walk_minutes
                runSlider.value  = data.run_minutes
                cycleSlider.value = data.cycles
                walkValue.textContent  = Math.round(data.walk_minutes)
                runValue.textContent   = Math.round(data.run_minutes)
                cycleValue.textContent = Math.round(data.cycles)
            }
        }

        let saveTimeout
        function scheduleSave() {
            clearTimeout(saveTimeout)
            saveTimeout = setTimeout(saveSettings, 800)
        }

        async function saveSettings() {
            const { data: { user } } = await sb.auth.getUser()
            if (!user) return
            await sb.from("settings").upsert({
                user_id:       user.id,
                walk_minutes:  parseFloat(walkSlider.value),
                run_minutes:   parseFloat(runSlider.value),
                cycles:        parseInt(cycleSlider.value),
                updated_at:    new Date().toISOString()
            }, { onConflict: "user_id" })
        }

        // ─── APP ─────────────────────────────────────────────────────────────────

        const walkSlider = document.getElementById("walkSlider")
        const runSlider  = document.getElementById("runSlider")
        const cycleSlider = document.getElementById("cycleSlider")

        const walkValue  = document.getElementById("walkValue")
        const runValue   = document.getElementById("runValue")
        const cycleValue = document.getElementById("cycleValue")

        const timerLabel    = document.getElementById("timer")
        const progressTotal = document.getElementById("progressTotal")
        const progressRing  = document.getElementById("progressRing")
        const cycleLabel    = document.getElementById("cycleLabel")

        const playBtn  = document.getElementById("playBtn")
        const pauseBtn = document.getElementById("pauseBtn")

        const playSound    = document.getElementById("playSound")
        const warn10       = document.getElementById("warn10")
        const warn3        = document.getElementById("warn3")
        const halfRun      = document.getElementById("halfRun")
        const finishRun    = document.getElementById("finishRun")
        const completeSound = document.getElementById("completeSound")
        const music        = document.getElementById("music")

        const activeClones = []

        function stopAllAudio() {
            document.querySelectorAll("audio").forEach(a => {
                a.pause()
                a.currentTime = 0
            })
            activeClones.forEach(a => {
                a.pause()
                a.currentTime = 0
            })
            activeClones.length = 0
        }

        function playAlert(sound) {
            const s = sound.cloneNode(true)
            s.currentTime = 0
            s.volume = sound.volume
            activeClones.push(s)
            s.onended = () => {
                const i = activeClones.indexOf(s)
                if (i !== -1) activeClones.splice(i, 1)
            }
            s.play().catch(() => {})
        }

        walkSlider.oninput = () => { walkValue.textContent = Math.round(walkSlider.value); scheduleSave() }
        runSlider.oninput  = () => { runValue.textContent  = Math.round(runSlider.value);  scheduleSave() }
        cycleSlider.oninput = () => { cycleValue.textContent = Math.round(cycleSlider.value); scheduleSave() }

        let timer = null
        let remaining = 0
        let phase = "walk"
        let cycle = 1

        let walkTime = 0
        let runTime  = 0
        let cycles   = 0

        let totalTime = 0
        let elapsed   = 0

        const circumference = 628

        function formatTime(s) {
            let m   = Math.floor(s / 60)
            let sec = s % 60
            return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0")
        }

        function updateRing() {
            let totalInterval = phase === "walk" ? walkTime : runTime
            let percent = (totalInterval - remaining) / totalInterval
            let offset  = circumference - (percent * circumference)
            progressRing.style.strokeDashoffset = offset
            progressRing.style.stroke = phase === "run" ? "#ff6b6b" : "#d7ff00"
        }

        function startTraining() {

            if (timer) return

            walkTime = Math.round(walkSlider.value) * 60
            runTime  = Math.round(runSlider.value) * 60
            cycles   = Math.round(cycleSlider.value)

            totalTime = (walkTime + runTime) * cycles

            remaining = walkTime
            phase     = "walk"
            cycle     = 1
            elapsed   = 0

            playAlert(playSound)

            document.body.classList.add("running")

            music.volume = 0.5
            music.currentTime = 0
            music.play().catch(() => {})

            timer = setInterval(tick, 1000)

            pauseBtn.disabled = false
            pauseBtn.classList.remove("border-gray-400", "text-gray-400", "cursor-not-allowed")
            pauseBtn.classList.add("border-white", "text-white")

        }

        function tick() {

            remaining--
            elapsed++

            timerLabel.textContent = formatTime(remaining)

            updateRing()

            let percent = (elapsed / totalTime) * 100
            progressTotal.style.width = percent + "%"

            if (phase === "walk") {
                if (remaining === 13) playAlert(warn10)
                if (remaining === 3)  playAlert(warn3)
            }

            if (phase === "run") {
                if (remaining === Math.floor(runTime / 2))
                    playAlert(halfRun)
            }

            if (remaining <= 0) {

                if (phase === "walk") {
                    phase     = "run"
                    remaining = runTime
                } else {

                    if (cycle >= cycles) {
                        completeSound.currentTime = 0
                        completeSound.play().catch(() => {})
                        resetTraining(true)
                        return
                    }

                    playAlert(finishRun)

                    cycle++
                    phase     = "walk"
                    remaining = walkTime

                }

            }

            cycleLabel.textContent = "Serie " + cycle + " / " + cycles

        }

        playBtn.onclick = () => {

            if (playBtn.textContent === "DETENER") {
                resetTraining()
                return
            }

            playBtn.textContent = "DETENER"
            playBtn.classList.remove("bg-[#d7ff00]")
            playBtn.classList.add("bg-red-500")

            startTraining()

        }

        pauseBtn.onclick = () => {

            if (timer) {

                clearInterval(timer)
                timer = null
                pauseBtn.textContent = "REANUDAR"
                music.pause()

            } else {

                timer = setInterval(tick, 1000)
                pauseBtn.textContent = "PAUSA"
                music.play().catch(() => {})

            }

        }

        function resetTraining(keepAudio = false) {

            clearInterval(timer)
            timer = null

            timerLabel.textContent = "00:00"
            progressTotal.style.width = "0%"
            progressRing.style.strokeDashoffset = circumference
            progressRing.style.stroke = "#d7ff00"
            cycleLabel.textContent = "LISTO"

            playBtn.textContent = "EMPEZAR"
            playBtn.classList.remove("bg-red-500")
            playBtn.classList.add("bg-[#d7ff00]")

            pauseBtn.disabled = true
            pauseBtn.textContent = "PAUSA"
            pauseBtn.classList.remove("border-white", "text-white")
            pauseBtn.classList.add("border-gray-400", "text-gray-400", "cursor-not-allowed")

            document.body.classList.remove("running")

            if (keepAudio) {
                music.pause()
                music.currentTime = 0
            } else {
                stopAllAudio()
            }

        }

        const iconSoundOn  = document.getElementById("iconSoundOn")
        const iconSoundOff = document.getElementById("iconSoundOff")

        musicToggle.onclick = () => {
            music.muted = !music.muted
            iconSoundOn.classList.toggle("hidden", music.muted)
            iconSoundOff.classList.toggle("hidden", !music.muted)
        }

    </script>

</body>
</html>
