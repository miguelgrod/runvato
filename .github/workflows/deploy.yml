name: Deploy to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ftp.cluster121.hosting.ovh.net
          username: runvatv
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: "."
          target: "/www"