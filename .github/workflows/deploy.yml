name: Deploy to OVH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: Dylan700/sftp-upload-action@latest
        with:
          server: ftp.cluster121.hosting.ovh.net
          username: runvatv
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          uploads: |
            ./ => /www/