<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2952f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reto 2026">
<title>Reto 2026 · Plan de entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* ─── tokens ─────────────────────────────────────────────────── */
  :root{
    --bg:#f3f4f7;
    --card:#ffffff;
    --card-2:#fafafa;
    --ink:#0b0c10;
    --ink-2:#3b3f49;
    --muted:#8a8f9b;
    --line:#ececf0;
    --primary:#2952f0;
    --primary-soft:#e8edff;
    --ok:#16a34a;
    --ok-soft:#e6f5ec;
    --warn:#f59e0b;
    --warn-soft:#fff4e0;
    --danger:#ef4444;
    --purple:#7c3aed;
    --purple-soft:#efeaff;
    --shadow:0 6px 24px rgba(20,20,40,.06);
    --radius:20px;
  }
  /* light theme forzado — sin auto dark */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.45;
    min-height:100dvh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle}
  .filled{font-variation-settings:'FILL' 1,'wght' 600}

  /* ─── layout ─────────────────────────────────────────────────── */
  #app{max-width:520px;margin:0 auto;padding:20px 18px 110px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;background:var(--card);
    display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
    transition:transform .15s ease, opacity .15s ease
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn[disabled]{opacity:.35;pointer-events:none}

  /* ─── cards ─────────────────────────────────────────────────── */
  .card{
    background:var(--card);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow);margin-bottom:14px
  }
  .card.tight{padding:14px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stack{display:flex;flex-direction:column;gap:8px}

  /* stats grid */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{
    background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)
  }
  .stat .label{color:var(--muted);font-size:12px;font-weight:500;margin-top:6px}
  .stat .value{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .stat .delta{font-size:12px;font-weight:700;color:var(--ok)}
  .grid-4 .stat{padding:10px 8px;border-radius:16px;text-align:left}
  .grid-4 .stat .badge-icon{width:30px;height:30px;border-radius:10px}
  .grid-4 .stat .badge-icon .material-symbols-outlined{font-size:18px}
  .grid-4 .stat .value{font-size:17px;margin-top:6px;line-height:1.1}
  .grid-4 .stat .label{font-size:10px;margin-top:2px;line-height:1.2}
  .grid-4 .stat .delta{font-size:10px}
  .badge-icon{
    width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--primary-soft);color:var(--primary)
  }
  .badge-icon.ok{background:var(--ok-soft);color:var(--ok)}
  .badge-icon.warn{background:var(--warn-soft);color:var(--warn)}
  .badge-icon.purple{background:var(--purple-soft);color:var(--purple)}

  /* progress ring */
  .ring{position:relative;width:64px;height:64px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .ring-num{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;letter-spacing:-.01em
  }

  /* progress bar */
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s ease}
  .bar.ok > i{background:var(--ok)}
  .bar.purple > i{background:var(--purple)}

  /* pills (chips de filtro) */
  .pills{display:flex;gap:8px;overflow-x:auto;margin:-4px -18px 14px;padding:4px 18px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{
    flex-shrink:0;padding:9px 16px;border-radius:99px;background:var(--card);
    font-size:13px;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow)
  }
  .pill.active{background:var(--primary);color:#fff}

  /* hero card (próxima sesión) */
  .hero{
    position:relative;border-radius:24px;overflow:hidden;color:#fff;
    padding:18px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;
    background:linear-gradient(135deg,#0b1230 0%,#1f2b6a 60%,#2952f0 100%);
    box-shadow:var(--shadow)
  }
  .hero .tag{
    position:absolute;top:14px;left:14px;background:var(--primary);
    padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase
  }
  .hero h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:0;font-size:13px;color:#cdd3ee;font-weight:500}
  .hero .meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#cdd3ee}
  .hero .meta b{color:#fff;font-weight:600}
  .hero .footer{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:14px;flex-wrap:wrap
  }
  .hero .cta{
    background:var(--primary);color:#fff;
    padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;
    display:inline-flex;align-items:center;gap:4px;flex-shrink:0;margin-left:auto
  }

  /* lista de tarjetas tipo "library" */
  .row-card{
    background:var(--card);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow);margin-bottom:10px;cursor:pointer;transition:transform .15s ease
  }
  .row-card:active{transform:scale(.98)}
  .row-card .thumb{
    width:56px;height:56px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;
    background:linear-gradient(135deg,#2952f0,#7c3aed)
  }
  .row-card .thumb.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .row-card .thumb.warn{background:linear-gradient(135deg,#f59e0b,#fb923c)}
  .row-card .thumb.purple{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
  .row-card .thumb.muted{background:linear-gradient(135deg,#6b7280,#9ca3af)}
  .row-card .body{flex:1;min-width:0}
  .row-card .body .t{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .row-card .body .s{font-size:12px;color:var(--muted);margin-top:2px}
  .row-card .body .meta{display:flex;gap:10px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
  .row-card .body .meta .match{color:var(--primary);font-weight:600;margin-left:auto}
  .row-card .play{
    width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--card);
    display:flex;align-items:center;justify-content:center;flex-shrink:0
  }
  .row-card.selectable{position:relative}
  .row-card.selected{box-shadow:0 0 0 2px var(--ok), var(--shadow);background:var(--ok-soft)}
  .row-card.selected .thumb{background:linear-gradient(135deg,#16a34a,#22c55e)}
  .row-card.disabled{opacity:.55}
  .row-card .pick{
    width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .2s
  }
  .row-card.selected .pick{background:var(--ok);border-color:var(--ok);color:#fff}
  .row-card.selected .pick::after{
    content:'';display:block;width:6px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(45deg) translate(-1px,-1px)
  }

  /* calendar */
  .cal{padding:16px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head .title{font-weight:700;letter-spacing:-.01em}
  .cal-head button{
    width:32px;height:32px;border-radius:50%;background:var(--card-2);
    display:inline-flex;align-items:center;justify-content:center
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-grid .dow{
    text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:4px 0
  }
  .cal-day{
    aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;color:var(--ink-2);position:relative;background:transparent
  }
  .cal-day.out{color:var(--muted);opacity:.4}
  .cal-day.today{background:var(--primary);color:#fff}
  .cal-day.has{cursor:pointer;background:var(--primary-soft);color:var(--primary)}
  .cal-day.has.done{background:var(--ok);color:#fff}
  .cal-day.has.miss{background:#fde7e7;color:var(--danger)}
  .cal-day.has.deload{background:var(--purple-soft);color:var(--purple)}
  .cal-day.today.has{background:var(--primary);color:#fff}
  .cal-day.today.has.done{background:var(--ok);color:#fff;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ok)}
  .cal-day.has.done .dot{background:#fff}
  .cal-day .dot{
    position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor
  }

  /* quote card */
  .quote-card{
    position:relative;background:linear-gradient(135deg,#0b1230 0%,#1f2b6a 60%,#2952f0 100%);
    color:#fff;border-radius:20px;padding:20px 22px 18px 26px;margin-bottom:14px;
    box-shadow:var(--shadow);overflow:hidden
  }
  .quote-card .quote-mark{
    position:absolute;top:-14px;left:14px;font-size:80px;opacity:.18;font-weight:800;
    font-family:Georgia,serif;line-height:1
  }
  .quote-card .quote-text{
    font-size:15px;font-weight:600;line-height:1.45;letter-spacing:-.01em;position:relative
  }
  .quote-card .quote-author{
    margin-top:8px;font-size:12px;color:#cdd3ee;font-weight:500
  }

  /* sync indicator */
  .sync{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    color:var(--muted);padding:4px 8px;border-radius:99px;background:var(--card)
  }
  .sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .sync.syncing .dot{background:var(--warn);animation:pulse 1s infinite}
  .sync.error .dot{background:var(--danger)}
  .sync.offline .dot{background:var(--muted)}
  .sync.guest .dot{background:var(--muted)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* welcome */
  .welcome{
    min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    padding:32px 22px;max-width:520px;margin:0 auto;text-align:center
  }
  .welcome .logo{
    width:72px;height:72px;border-radius:24px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:var(--shadow)
  }
  .welcome h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
  .welcome p{color:var(--muted);margin:0 0 22px}
  .welcome input[type=date],
  .welcome input[type=email],
  .welcome input[type=password]{
    width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:16px;font-family:inherit;margin-bottom:10px
  }
  .welcome .login-error{
    background:#fde7e7;color:var(--danger);padding:10px 14px;border-radius:12px;
    font-size:13px;font-weight:600;margin-bottom:10px;text-align:left
  }
  .btn-primary{
    width:100%;padding:16px 22px;background:var(--primary);color:#fff;
    border-radius:99px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px
  }
  .btn-primary:disabled{opacity:.4}
  .btn-ghost{
    width:100%;padding:14px 22px;background:transparent;color:var(--ink-2);
    border-radius:99px;font-weight:600;font-size:14px
  }

  /* exercise items */
  .ex{
    display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--card-2);
    border-radius:14px;margin-bottom:8px;cursor:pointer;transition:background .15s ease
  }
  .ex:active{background:var(--line)}
  .ex .check{
    width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .2s
  }
  .ex.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
  .ex.done .check::after{
    content:'';display:block;width:6px;height:11px;border-right:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(45deg) translate(-1px,-1px)
  }
  .ex .text{flex:1;font-size:14px;line-height:1.45;color:var(--ink-2)}
  .ex.done .text > div:first-child{text-decoration:line-through;color:var(--muted)}
  .ex-note{
    margin-top:6px;padding:6px 10px;background:var(--primary-soft);color:var(--primary);
    border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;line-height:1.3
  }
  .ex-note .material-symbols-outlined{font-size:14px}
  .ex-history-toggle{
    margin-top:6px;font-size:12px;color:var(--muted);font-weight:600;
    display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:4px 0
  }
  .ex-history-toggle .material-symbols-outlined{font-size:14px}
  .ex-history{display:none;margin-top:4px;padding:8px 10px;background:var(--card);border-radius:8px}
  .ex-history.open{display:block}
  .ex-history-item{font-size:12px;color:var(--ink-2);display:flex;gap:8px;padding:3px 0}
  .ex-history-date{color:var(--muted);font-weight:600;flex-shrink:0;text-transform:capitalize}
  .ex-history-note{color:var(--ink-2)}
  .ex-actions{
    flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);background:transparent;cursor:pointer
  }
  .ex-actions:hover{background:var(--card)}
  .ex-actions .material-symbols-outlined{font-size:18px}

  /* meta line */
  .meta-line{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
  .meta-line .m{display:inline-flex;align-items:center;gap:4px}
  .meta-line .m .material-symbols-outlined{font-size:16px}

  /* type chip */
  .chip{
    display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;
    font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase
  }
  .chip.cardio{background:var(--primary-soft);color:var(--primary)}
  .chip.fuerza{background:var(--warn-soft);color:#d97706}
  .chip.bici{background:var(--ok-soft);color:var(--ok)}
  .chip.marcha{background:var(--purple-soft);color:var(--purple)}
  .chip.movilidad{background:var(--line);color:var(--ink-2)}
  .chip.deload{background:var(--purple-soft);color:var(--purple)}
  .chip.objetivo{background:#fff0d6;color:#b45309}

  /* nota motivacional */
  .note{
    background:linear-gradient(135deg,var(--primary-soft),transparent);
    border-left:3px solid var(--primary);padding:12px 14px;border-radius:12px;
    font-size:13px;color:var(--ink-2);margin-bottom:12px
  }
  .note.purple{background:linear-gradient(135deg,var(--purple-soft),transparent);border-color:var(--purple)}
  .note.warn{background:linear-gradient(135deg,#fff0d6,transparent);border-color:#d97706}

  /* bottom nav */
  .navbar{
    position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--line);
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:50
  }
  .navbar .inner{
    max-width:520px;margin:0 auto;display:flex;justify-content:space-around;align-items:center
  }
  .navbar .nav{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;color:var(--muted);
    font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex:1
  }
  .navbar .nav.active{color:var(--ink)}
  .navbar .nav.active .material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 600}

  /* celebración */
  .celebrate{
    position:fixed;inset:0;background:rgba(11,12,16,.6);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease
  }
  .celebrate.show{opacity:1;pointer-events:auto}
  .celebrate-card{
    background:var(--card);border-radius:24px;padding:32px 28px;text-align:center;
    max-width:340px;width:90%;transform:scale(.9);transition:transform .3s cubic-bezier(.34,1.56,.64,1)
  }
  .celebrate.show .celebrate-card{transform:scale(1)}
  .celebrate-card .emoji{font-size:64px;margin-bottom:8px;animation:pop .5s ease}
  .celebrate-card h3{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .celebrate-card p{margin:0 0 18px;color:var(--muted);font-size:14px}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

  /* views */
  .view{animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* small */
  .small{font-size:12px;color:var(--muted)}
  .h-section{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between}
  .h-section .link{font-size:13px;color:var(--primary);font-weight:600}
  .back-btn{
    width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
    display:inline-flex;align-items:center;justify-content:center
  }
</style>
</head>
<body>

<div id="root"></div>

<div id="celebrate" class="celebrate">
  <div class="celebrate-card">
    <div class="emoji" id="celebrate-emoji">🎉</div>
    <h3 id="celebrate-title">¡Sesión completada!</h3>
    <p id="celebrate-text">Buen trabajo, sigue así.</p>
    <button class="btn-primary" onclick="hideCelebrate()">Continuar</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   PLAN DE 24 SEMANAS
   Cada semana: { phase, label, isDeload?, isObjective?, isTaper?, sessions:[…] }
   Cada sesión:  { day:'Tue|Thu|Sat|Sun', type, location, duration, title, items[], note? }
   ════════════════════════════════════════════════════════════════ */
const PLAN = [
  // ─── FASE 1 — Base y adaptación ───
  {phase:1, label:'Base y adaptación', sessions:[
    {day:'Tue',type:'Cardio',location:'Aire libre',duration:30,title:'Marcha + trote',items:[
      '5 min calentamiento caminando',
      '4 min marcha rápida / 1 min trote suave × 5 series',
      '5 min vuelta a la calma',
      'Ritmo trote: ~8:00–9:00 min/km (muy cómodo, zona 2)'
    ]},
    {day:'Thu',type:'Fuerza',location:'Gimnasio',duration:45,title:'Circuito básico',items:[
      'Sentadilla con peso corporal 3×12',
      'Zancada alternada 3×10 cada pierna',
      'Push-up inclinado (manos en banco) 3×10',
      'Plancha isométrica 3×20 seg',
      'Glute bridge 3×15'
    ]},
    {day:'Sat',type:'Bici',location:'Exterior',duration:60,title:'Rodada suave',items:[
      '5 min calentamiento pedaleando suave',
      '45–50 min en llano a ritmo Z2 (puedes hablar con frases enteras)',
      'Cadencia cómoda 70–80 rpm',
      '5 min enfriamiento',
      'Llevar agua (0,5 L mínimo)'
    ]}
  ]},
  {phase:1, label:'Base y adaptación', sessions:[

}

/* ── sync con Supabase ────────────────────────────────────────── */
let pushTimer = null;
function debouncedPush(){
  clearTimeout(pushTimer);
  state.syncStatus = 'syncing';
  pushTimer = setTimeout(()=>{ pushToCloud(); }, 800);
  updateSyncBadge();
}

async function pushToCloud(){
  if(!state.user) return;
  state.syncStatus = 'syncing'; updateSyncBadge();
  try{
    const payload = {
      user_id: state.user.id,
      state: {
        startDate: state.startDate,
        done: state.done,
        notes: state.notes,
        diet: state.diet
      },
      updated_at: new Date().toISOString()
    };
    const { error } = await sb.from('train_progress').upsert(payload, { onConflict: 'user_id' });
    if(error) throw error;
    state.syncStatus = 'idle';
  }catch(e){
    console.error('push error', e);
    state.syncStatus = navigator.onLine ? 'error' : 'offline';
  }
  updateSyncBadge();
}

async function pullFromCloud(){
  if(!state.user) return;
  state.syncStatus = 'syncing'; updateSyncBadge();
  try{
    const { data, error } = await sb
      .from('train_progress')
      .select('state, updated_at')
      .eq('user_id', state.user.id)
      .maybeSingle();
    if(error) throw error;

    const cloud = data?.state;
    const hasLocal = !!(state.startDate || Object.keys(state.done).length || Object.keys(state.notes).length || Object.keys(state.diet).length);

    if(!cloud){
      // primer login en este usuario; si hay datos locales, preguntar
      if(hasLocal){
        const upload = confirm('Hay progreso local en este dispositivo. ¿Subirlo a tu cuenta en la nube?\n\n• Aceptar: tu progreso local pasa a tu cuenta.\n• Cancelar: empezar vacío en la nube (los datos locales se descartan).');
        if(upload){
          await pushToCloud();
        }else{
          state.startDate=null; state.done={}; state.notes={}; state.diet={};
          saveLocal();
          await pushToCloud();
        }
      }else{
        await pushToCloud(); // crea fila vacía
      }
    }else{
      // adoptar el estado de la nube como canónico
      state.startDate = cloud.startDate ?? null;
      state.done = cloud.done || {};
      state.notes = cloud.notes || {};
      state.diet = cloud.diet || {};
      saveLocal();
      state.syncStatus = 'idle';
    }
  }catch(e){
    console.error('pull error', e);
    state.syncStatus = navigator.onLine ? 'error' : 'offline';
  }
  updateSyncBadge();
}

async function initAuth(){
  // por si venimos del magic link
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    state.user = { id: session.user.id, email: session.user.email };
    state.guestMode = false;
    await pullFromCloud();
  }else if(state.guestMode){
    state.syncStatus = 'guest';
  }
  state.bootstrapping = false;

  sb.auth.onAuthStateChange(async (event, session)=>{
    if(event==='SIGNED_IN' && session){
      state.user = { id: session.user.id, email: session.user.email };
      state.guestMode = false; saveLocal();
      await pullFromCloud();
      state.view = 'home';
      render();
    }else if(event==='SIGNED_OUT'){
      state.user = null;
      state.syncStatus = state.guestMode ? 'guest' : 'idle';
      render();
    }
  });
}

async function signInPassword(email, password){

function exKey(w,s,i){ return `${w}-${s}-${i}`; }
function getNote(w,s,i){ return state.notes[exKey(w,s,i)] || ''; }
function setNote(w,s,i,text){
  const k = exKey(w,s,i);
  if(text && text.trim()) state.notes[k] = text.trim();
  else delete state.notes[k];
  saveState();

// Histórico: busca la misma cadena de ejercicio en sesiones pasadas con anotación
function exerciseHistory(w, s, i){
  const text = PLAN[w].sessions[s].items[i];
  const out = [];
  for(let pw=0; pw<=w; pw++){
    for(let ps=0; ps<PLAN[pw].sessions.length; ps++){
      if(pw===w && ps===s) continue; // saltar el actual
      const items = PLAN[pw].sessions[ps].items;
      for(let pi=0; pi<items.length; pi++){
        if(items[pi]===text){
          const note = getNote(pw,ps,pi);
          if(note){
            const sd = sessionDate(pw,ps);
            out.push({w:pw, s:ps, i:pi, note, date:sd});
          }
        }
      }
    }
  }
  return out.sort((a,b)=>(b.date||0)-(a.date||0));
}

function setMeal(iso, key, value){

  if(d[key]===value) delete d[key]; else d[key] = value;
  if(Object.keys(d).length===0) delete state.diet[iso];
  else state.diet[iso] = d;
  saveState();
}
function dinnerCountThisWeek(iso, dinnerIdx){
  // cuenta cuántas veces aparece dinnerIdx en los últimos 7 días (lun-dom de esa semana)
  const d = new Date(iso+'T00:00:00');
  const dow = (d.getDay()+6)%7; // 0=lun
  const monday = new Date(d); monday.setDate(d.getDate()-dow);
  let n = 0;
  for(let i=0;i<7;i++){
    const day = new Date(monday); day.setDate(monday.getDate()+i);
    const k = isoOfDate(day);
    if(k===iso) continue; // no contamos el día actual al evaluar
    if(state.diet[k]?.dinner===dinnerIdx) n++;
  }
  return n;
}

/* ════════════════════════════════════════════════════════════════
   CÁLCULOS DE FECHA ↔ SESIÓN
   ════════════════════════════════════════════════════════════════ */
const DAY_OFFSET = {Tue:1, Thu:3, Sat:5, Sun:6}; // desde lunes (0)

function startMonday(){
  if(!state.startDate) return null;
  return new Date(state.startDate + 'T00:00:00');
}
function sessionDate(weekIdx, sessionIdx){
  const start = startMonday(); if(!start) return null;
  const session = PLAN[weekIdx].sessions[sessionIdx];
  const d = new Date(start);
  d.setDate(d.getDate() + weekIdx*7 + DAY_OFFSET[session.day]);
  return d;
}
function isoOfDate(d){
  // formatear en zona local (toISOString usa UTC y desplaza el día en TZ +N)
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function sameDay(a,b){
  return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
}
function todayDate(){
  const d=new Date(); d.setHours(0,0,0,0); return d;
}
// devuelve {weekIdx, sessionIdx} si en esa fecha hay sesión
function sessionAt(date){
  for(let w=0;w<PLAN.length;w++){
    for(let s=0;s<PLAN[w].sessions.length;s++){
      const sd = sessionDate(w,s);
      if(sd && sameDay(sd, date)) return {weekIdx:w, sessionIdx:s};
    }
  }
  return null;
}

/* ════════════════════════════════════════════════════════════════
   ESTADO DE SESIONES (completada / pendiente)
   ════════════════════════════════════════════════════════════════ */
function isItemDone(w,s,i){ return !!state.done[`${w}-${s}-${i}`]; }
function toggleItem(w,s,i){
  const k = `${w}-${s}-${i}`;
  if(state.done[k]) delete state.done[k]; else state.done[k] = true;
  saveState();
}
function sessionProgress(w,s){
  const items = PLAN[w].sessions[s].items;
  const done = items.reduce((n,_,i)=>n+(isItemDone(w,s,i)?1:0),0);
  return {done, total:items.length, complete: done===items.length};
}
function weekProgress(w){
  const total = PLAN[w].sessions.length;
  let done = 0;
  for(let s=0;s<total;s++) if(sessionProgress(w,s).complete) done++;
  return {done,total,complete:done===total};
}
function totalSessions(){
  return PLAN.reduce((n,w)=>n+w.sessions.length,0);
}
function totalDone(){
  let n=0;
  for(let w=0;w<PLAN.length;w++) for(let s=0;s<PLAN[w].sessions.length;s++) if(sessionProgress(w,s).complete) n++;
  return n;
}
function phaseProgress(phase){
  let total=0, done=0;
  for(let w=0;w<PLAN.length;w++){
    if(PLAN[w].phase!==phase) continue;
    for(let s=0;s<PLAN[w].sessions.length;s++){
      total++;
      if(sessionProgress(w,s).complete) done++;
    }
  }
  return {done,total};
}
function activeWeekIdx(){
  // primera semana sin todas las sesiones completas; si todas, la última
  for(let w=0;w<PLAN.length;w++) if(!weekProgress(w).complete) return w;
  return PLAN.length-1;
}
function nextSession(){
  const today = todayDate();
  for(let w=0;w<PLAN.length;w++){
    for(let s=0;s<PLAN[w].sessions.length;s++){
      if(sessionProgress(w,s).complete) continue;
      const sd = sessionDate(w,s);
      if(!sd) continue;
      if(sd >= today) return {weekIdx:w, sessionIdx:s, date:sd};
    }
  }
  // si no hay futura, devolver la primera pendiente (puede ser pasada)
  for(let w=0;w<PLAN.length;w++){
    for(let s=0;s<PLAN[w].sessions.length;s++){
      if(!sessionProgress(w,s).complete) return {weekIdx:w, sessionIdx:s, date:sessionDate(w,s)};
    }
  }
  return null;
}

/* ════════════════════════════════════════════════════════════════
   RENDER — utilidades
   ════════════════════════════════════════════════════════════════ */
const $ = sel => document.querySelector(sel);
const root = ()=>document.getElementById('root');
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    const v = attrs[k];
    if(v===false || v==null) continue; // ignora atributos falsy (evita disabled="false")
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v===true ? '' : v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string' ? document.createTextNode(c) : c);
  });
  return e;
}
function icon(name, cls=''){ return el('span',{class:'material-symbols-outlined '+cls}, name); }
function fmtDate(d){
  if(!d) return '';
  return d.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'short'});
}
function fmtMonth(y,m){
  return new Date(y,m,1).toLocaleDateString('es-ES',{month:'long', year:'numeric'});
}
function typeClass(t){
  return ({Cardio:'cardio',Fuerza:'fuerza',Bici:'bici',Marcha:'marcha',Movilidad:'movilidad'})[t] || 'cardio';
}
function locIcon(l){
  return ({'Aire libre':'park','Gimnasio':'fitness_center','Exterior':'terrain'})[l] || 'place';
}
function typeIcon(t){
  return ({Cardio:'directions_run',Fuerza:'fitness_center',Bici:'directions_bike',Marcha:'hiking',Movilidad:'self_improvement'})[t]||'sports';
}

function stat(iconName, value, label, delta, badgeClass){
  const card = el('div',{class:'stat'});
  const head = el('div',{class:'between'},[
    el('div',{class:badgeClass}, icon(iconName,'filled')),
    delta? el('div',{class:'delta'}, delta) : null
  ]);
  card.append(head, el('div',{class:'value'}, value), el('div',{class:'label'}, label));
  return card;
}

function progressRow(label, done, total, kind){
  const pct = total? Math.round(done/total*100):0;
  return el('div',{style:'margin-bottom:14px'},[
    el('div',{class:'between', style:'margin-bottom:6px'},[
      el('div',{style:'font-weight:600;font-size:13px'}, label),
      el('div',{class:'small'}, `${done}/${total} · ${pct}%`)
    ]),
    el('div',{class:'bar '+kind},[el('i',{style:`width:${pct}%`})])
  ]);

function sessionRow(w, s){
  const ses = PLAN[w].sessions[s];
  const prog = sessionProgress(w,s);
  const sd = sessionDate(w,s);
  const today = todayDate();
  const past = sd && sd < today;
  let thumbCls = 'thumb';
  if(prog.complete) thumbCls += ' ok';
  else if(PLAN[w].isDeload) thumbCls += ' purple';
  else if(past) thumbCls += ' warn';

  return el('div',{class:'row-card', onclick:()=>goSession(w,s)},[
    el('div',{class:thumbCls}, icon(typeIcon(ses.type),'filled')),
    el('div',{class:'body'},[
      el('div',{class:'t'}, ses.title),
      el('div',{class:'s'}, [el('span',{class:'chip '+typeClass(ses.type)}, ses.type), ' ', sd?capitalize(fmtDate(sd)):'']),
      el('div',{class:'meta'},[
        el('span',{},[icon('schedule'), ' ', `${ses.duration}m`]),
        el('span',{},[icon(locIcon(ses.location)), ' ', ses.location]),
        el('span',{class:'match'}, prog.complete?'Completada':`${prog.done}/${prog.total}`)
      ])
    ]),
    el('div',{class:'play'}, icon(prog.complete?'check':'play_arrow','filled'))
  ]);
}

/* ─── calendar ────────────────────────────────────────────────── */
function viewCalendar(){
  if(!state.calMonth){
    const t = todayDate();
    state.calMonth = {y:t.getFullYear(), m:t.getMonth()};
  }
  const {y,m} = state.calMonth;
  const wrap = el('div',{class:'cal'});
  wrap.appendChild(el('div',{class:'cal-head'},[
    el('button',{onclick:()=>{state.calMonth={y:m===0?y-1:y, m:m===0?11:m-1}; render()}}, icon('chevron_left')),
    el('div',{class:'title'}, capitalize(fmtMonth(y,m))),
    el('button',{onclick:()=>{state.calMonth={y:m===11?y+1:y, m:m===11?0:m+1}; render()}}, icon('chevron_right'))
  ]));
  const grid = el('div',{class:'cal-grid'});
  ['L','M','X','J','V','S','D'].forEach(d=>grid.appendChild(el('div',{class:'dow'}, d)));

  // primer día de la cuadrícula (lunes anterior)
  const first = new Date(y, m, 1);
  const offset = (first.getDay()+6)%7; // 0=lunes
  const start = new Date(first); start.setDate(first.getDate()-offset);

  const today = todayDate();
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const inMonth = d.getMonth()===m;
    const isToday = sameDay(d, today);
    const sess = sessionAt(d);
    let cls = 'cal-day';
    if(!inMonth) cls += ' out';
    if(isToday) cls += ' today';
    if(sess){
      cls += ' has';
      const prog = sessionProgress(sess.weekIdx, sess.sessionIdx);
      if(prog.complete) cls += ' done';
      else if(d < today) cls += ' miss';
      else if(PLAN[sess.weekIdx].isDeload) cls += ' deload';
    }
    const cell = el('div',{class:cls,
      onclick: sess?()=>goSession(sess.weekIdx, sess.sessionIdx):null
    }, String(d.getDate()));
    if(sess) cell.appendChild(el('div',{class:'dot'}));
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);

  // leyenda
  wrap.appendChild(el('div',{class:'small', style:'display:flex;gap:14px;flex-wrap:wrap;margin-top:12px'},[
    legendDot('var(--primary)', 'Pendiente'),
    legendDot('var(--ok)', 'Completada'),
    legendDot('var(--danger)', 'No realizada'),
    legendDot('var(--purple)', 'Deload')
  ]));

  return wrap;
}
function legendDot(color, label){
  return el('span',{style:'display:inline-flex;align-items:center;gap:6px'},[
    el('span',{style:`width:8px;height:8px;border-radius:50%;background:${color};display:inline-block`}),
    label
  ]);
}

    const ul = el('div',{style:'margin-top:12px'});
    ul.appendChild(el('div',{class:'h-section',style:'margin:0 0 8px;font-size:14px'}, kind.kind==='long'?'Antes / durante el entreno':kind.kind==='double'?'Recuperación entre etapas':'Antes de salir a entrenar'));
    fuelList.forEach(t=>ul.appendChild(el('div',{class:'ex',style:'cursor:default'},[el('div',{class:'check',style:'border-color:transparent;background:var(--primary);color:#fff'},[icon('bolt','filled')]), el('div',{class:'text'}, t)])));
    adapt.appendChild(ul);
  }
  wrap.appendChild(adapt);

  // nota especial de la semana (si aplica)
  if(sessWeekIdx!=null){
    const note = weekDietNote(sessWeekIdx);
    if(note){
      const cls = note.kind==='objective'?'warn':note.kind==='deload'||note.kind==='taper'?'purple':'';
      wrap.appendChild(el('div',{class:'note '+cls},[
        el('strong',{},`Semana ${sessWeekIdx+1}: `), note.text
      ]));
    }
  }

  const iso = state.dietDate;
  const log = dietOf(iso);

  // media mañana — selección de opción (radio: única)
  wrap.appendChild(el('h2',{class:'h-section'},[
    'Media mañana',
    el('span',{class:'small'}, log.morning!=null?'✓ registrada':'')
  ]));
  MORNING_SNACK.forEach((opt,i)=>{
    const selected = log.morning===i;
    wrap.appendChild(el('div',{class:'row-card selectable'+(selected?' selected':''), onclick:()=>{
      // selección exclusiva: si pulsas la otra, cambia
      if(log.morning===i) setMeal(iso,'morning',i); // toggle off
      else { state.diet[iso] = {...dietOf(iso), morning:i}; saveState(); }
      render();
    }},[
      el('div',{class:'thumb'}, icon('breakfast_dining','filled')),
      el('div',{class:'body'},[
        el('div',{class:'t'}, `Opción ${i+1}`),
        el('div',{class:'s',style:'margin-top:4px;line-height:1.4'}, opt)
      ]),
      el('div',{class:'pick'})
    ]));
  });

  // comida del día — toggle realizada
  const lunch = LUNCH[date.getDay()];
  const lunchDone = !!log.lunch;
  wrap.appendChild(el('h2',{class:'h-section'},[
    'Comida',
    el('span',{class:'small'}, lunchDone?'✓ realizada':'')
  ]));
  wrap.appendChild(el('div',{class:'row-card selectable'+(lunchDone?' selected':''), onclick:()=>{setMeal(iso,'lunch',true);render()}},[
    el('div',{class:'thumb warn'}, icon('restaurant','filled')),
    el('div',{class:'body'},[
      el('div',{class:'t'}, lunch.title),
      el('div',{class:'s',style:'margin-top:4px;line-height:1.4'}, lunch.desc)
    ]),
    el('div',{class:'pick'})
  ]));

  // cena — selección de una opción (con aviso de restricción semanal)
  wrap.appendChild(el('h2',{class:'h-section'},[
    'Cena · elige una opción',
    el('span',{class:'small'}, log.dinner!=null?'✓ registrada':'')
  ]));
  DINNERS.forEach((d,i)=>{
    const restricted = d.limit.startsWith('Máximo');
    const selected = log.dinner===i;
    const usedThisWeek = restricted ? dinnerCountThisWeek(iso, i) : 0;
    const limitReached = restricted && usedThisWeek>=1 && !selected;
    wrap.appendChild(el('div',{class:'row-card selectable'+(selected?' selected':'')+(limitReached?' disabled':''), onclick:()=>{
      if(limitReached){ alert('Esta cena ya se ha tomado esta semana (máximo 1 vez/semana).'); return; }
      if(log.dinner===i){ setMeal(iso,'dinner',i); }
      else { state.diet[iso] = {...dietOf(iso), dinner:i}; saveState(); }
      render();
    }},[
      el('div',{class:'thumb '+(restricted?'purple':'ok')}, icon(restricted?'event_available':'check_circle','filled')),
      el('div',{class:'body'},[
        el('div',{class:'t'}, d.title),
        el('div',{class:'s',style:'margin-top:4px;color:'+(restricted?'var(--purple)':'var(--ok)')}, d.limit + (restricted&&usedThisWeek>0?` · ya tomada esta semana`:''))
      ]),
      el('div',{class:'pick'})
    ]));
  });

  // media tarde — toggle realizada (opcional)
  const afternoonDone = !!log.afternoon;
  wrap.appendChild(el('h2',{class:'h-section'},[
    'Media tarde',
    el('span',{class:'small'}, afternoonDone?'✓ realizada':'opcional')
  ]));
  wrap.appendChild(el('div',{class:'row-card selectable'+(afternoonDone?' selected':''), onclick:()=>{setMeal(iso,'afternoon',true);render()}},[
    el('div',{class:'thumb muted'}, icon('local_cafe','filled')),
    el('div',{class:'body'},[
      el('div',{class:'t'}, 'Merienda'),
      el('div',{class:'s',style:'margin-top:4px;line-height:1.4'}, AFTERNOON_SNACK)
    ]),
    el('div',{class:'pick'})
  ]));

  // normas fijas
  wrap.appendChild(el('h2',{class:'h-section'},'Normas fijas'));
  const rules = el('div',{class:'card'});
  FIXED_RULES.forEach(r=>rules.appendChild(el('div',{class:'ex',style:'cursor:default'},[
    el('div',{class:'check',style:'border-color:transparent;background:var(--ok-soft);color:var(--ok)'}, icon('check','filled')),
    el('div',{class:'text'}, r)
  ])));
  wrap.appendChild(rules);

  return wrap;
}

/* ─── history view ────────────────────────────────────────────── */
function viewHistory(){
  const wrap = el('div',{});
  wrap.appendChild(el('div',{class:'topbar'},[
    el('button',{class:'back-btn', onclick:()=>{state.view='home';render()}}, icon('arrow_back')),
    el('div',{style:'text-align:center;flex:1'},[
      el('div',{style:'font-weight:800;letter-spacing:-.02em;font-size:18px'}, 'Historial'),
      el('div',{class:'sub'}, 'Actividad y comidas')
    ]),
    el('div',{style:'width:40px'})
  ]));

  // recopilar todas las fechas relevantes (sesiones + diet)
  const dates = new Map(); // iso -> {date, sess?, log?}
  for(let w=0;w<PLAN.length;w++){
    for(let s=0;s<PLAN[w].sessions.length;s++){
      const sd = sessionDate(w,s);
      if(!sd) continue;
      const k = isoOfDate(sd);
      const cur = dates.get(k) || {date:sd};
      cur.sess = {w, s};
      dates.set(k, cur);
    }
  }
  Object.keys(state.diet).forEach(k=>{
    const cur = dates.get(k) || {date:new Date(k+'T00:00:00')};
    cur.log = state.diet[k];
    dates.set(k, cur);
  });

  const today = todayDate();
  // filtrar: solo días con actividad realizada o pasada (más útil para historial)
  const entries = Array.from(dates.values()).filter(e=>{
    if(e.date>today) return false;
    if(e.sess){
      const prog = sessionProgress(e.sess.w, e.sess.s);
      if(prog.done>0 || e.date<=today) return true;
    }
    if(e.log && Object.keys(e.log).length>0) return true;
    return e.date<=today && e.sess; // entrenamientos pasados aunque vacíos
  });
  entries.sort((a,b)=>b.date-a.date);

  if(entries.length===0){
    wrap.appendChild(el('div',{class:'card', style:'text-align:center;color:var(--muted);padding:32px 18px'},[
      el('div',{},icon('history','filled')),
      el('div',{style:'margin-top:8px'}, 'Aún no hay actividad registrada.'),
      el('div',{class:'small', style:'margin-top:4px'}, 'Marca ejercicios o comidas y aparecerán aquí.')
    ]));
    return wrap;
  }

  // resumen
  const trainDone = entries.filter(e=>e.sess && sessionProgress(e.sess.w,e.sess.s).complete).length;
  const dietDays = entries.filter(e=>e.log && Object.keys(e.log).length>0).length;
  const sumGrid = el('div',{class:'grid-2', style:'margin-bottom:14px'});
  sumGrid.appendChild(stat('directions_run', String(trainDone), 'Sesiones completadas', null, 'badge-icon ok'));
  sumGrid.appendChild(stat('restaurant', String(dietDays), 'Días con comidas', null, 'badge-icon warn'));
  wrap.appendChild(sumGrid);

  // agrupar por mes
  let currentMonth = '';
  entries.forEach(e=>{
    const monthLabel = capitalize(e.date.toLocaleDateString('es-ES',{month:'long', year:'numeric'}));
    if(monthLabel!==currentMonth){
      wrap.appendChild(el('h2',{class:'h-section'}, monthLabel));
      currentMonth = monthLabel;
    }
    wrap.appendChild(historyRow(e));
  });

  return wrap;
}

function historyRow(e){
  const iso = isoOfDate(e.date);
  const dateLabel = capitalize(e.date.toLocaleDateString('es-ES',{weekday:'short', day:'numeric', month:'short'}));
  const card = el('div',{class:'card', style:'cursor:pointer', onclick:()=>{state.dietDate=iso;state.view='diet';render()}});

  // header del día
  const head = el('div',{class:'between', style:'margin-bottom:10px'},[
    el('div',{style:'font-weight:700;letter-spacing:-.01em;font-size:15px'}, dateLabel),
    el('div',{class:'small'}, iso)
  ]);
  card.appendChild(head);

  // training row
  if(e.sess){
    const ses = PLAN[e.sess.w].sessions[e.sess.s];
    const prog = sessionProgress(e.sess.w, e.sess.s);
    const stateLabel = prog.complete?'Completada':prog.done>0?`${prog.done}/${prog.total} ítems`:'No realizada';
    const stateColor = prog.complete?'var(--ok)':prog.done>0?'var(--warn)':'var(--danger)';
    card.appendChild(el('div',{class:'row', style:'gap:10px;padding:10px 0;border-bottom:1px solid var(--line)', onclick:ev=>{ev.stopPropagation();goSession(e.sess.w,e.sess.s)}},[
      el('div',{class:'badge-icon '+(prog.complete?'ok':'warn')}, icon(typeIcon(ses.type),'filled')),
      el('div',{style:'flex:1;min-width:0'},[
        el('div',{style:'font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'}, ses.title),
        el('div',{class:'small'}, [
          el('span',{class:'chip '+typeClass(ses.type), style:'font-size:10px;padding:3px 8px'}, ses.type),
          ' · ', `${ses.duration} min`
        ])
      ]),
      el('div',{class:'small', style:'color:'+stateColor+';font-weight:700'}, stateLabel)
    ]));
  }

  // diet row
  if(e.log && Object.keys(e.log).length>0){
    const lunchDay = LUNCH[e.date.getDay()];
    const items = [];
    if(e.log.morning!=null) items.push(`Media mañana: opción ${e.log.morning+1}`);
    if(e.log.lunch) items.push(`Comida: ${lunchDay.title}`);
    if(e.log.afternoon) items.push(`Media tarde: ✓`);
    if(e.log.dinner!=null) items.push(`Cena: ${DINNERS[e.log.dinner].title}`);
    card.appendChild(el('div',{style:'padding-top:10px'},[
      el('div',{class:'row',style:'gap:10px;margin-bottom:6px'},[
        el('div',{class:'badge-icon warn'}, icon('restaurant','filled')),
        el('div',{style:'font-weight:600;font-size:14px'}, 'Comidas registradas')
      ]),
      el('div',{class:'small', style:'padding-left:46px;line-height:1.6'}, items.join(' · '))
    ]));
  }else if(!e.sess){
    card.appendChild(el('div',{class:'small', style:'padding:10px 0 0;color:var(--muted)'}, 'Sin registros'));
  }

  return card;
}

/* ─── bottom nav ──────────────────────────────────────────────── */
function viewNav(){
  const nav = el('div',{class:'navbar'});
  const inner = el('div',{class:'inner'});
  const items = [
    {key:'home', label:'Inicio', icon:'home'},
    {key:'week', label:'Semana', icon:'view_week'},
    {key:'diet', label:'Nutrición', icon:'restaurant'},
    {key:'history', label:'Historial', icon:'history'}
  ];
  items.forEach(it=>{
    const active = (state.view==='home' && it.key==='home') ||
                   (state.view==='week' && it.key==='week') ||
                   (state.view==='session' && it.key==='week') ||
                   (state.view==='diet' && it.key==='diet') ||
                   (state.view==='history' && it.key==='history');
    inner.appendChild(el('button',{class:'nav'+(active?' active':''), onclick:()=>{
      if(it.key==='home') {state.view='home';}
      else if(it.key==='week') {state.weekIdx=activeWeekIdx();state.view='week';}
      else if(it.key==='diet') {state.dietDate=isoOfDate(todayDate());state.view='diet';}
      else if(it.key==='history') {state.view='history';}
      render();
    }},[
      icon(it.icon), el('span',{}, it.label)
    ]));
  });
  nav.appendChild(inner);
  return nav;
}

/* ─── settings ────────────────────────────────────────────────── */
function openSettings(){
  const sessionLine = state.user
    ? `Sesión: ${state.user.email}`
    : state.guestMode ? 'Modo invitado (sin cuenta)' : 'Sin sesión';
  const opts = [
    sessionLine,
    '',
    '1. Cambiar fecha de inicio',
    '2. Forzar sincronización ahora',
    '3. Exportar copia de seguridad (JSON)',
    '4. Importar copia de seguridad',
    state.user ? '5. Cerrar sesión' : '5. Iniciar sesión',
    '6. Borrar todo el progreso (este dispositivo)',
    '',
    'Escribe el número y pulsa OK:'
  ].join('\n');
  const choice = (prompt(opts, '1')||'').trim();
  if(!choice) return;
  if(choice==='1'){
    const v = prompt('Fecha de inicio del plan (YYYY-MM-DD):', state.startDate || '');
    if(v===null || !v.trim()) return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ alert('Formato no válido. Usa YYYY-MM-DD.'); return; }
    state.startDate = v; saveState(); render();
  }else if(choice==='2'){
    if(!state.user){ alert('Inicia sesión para sincronizar con la nube.'); return; }
    pushToCloud().then(()=>alert('Sincronizado.'));
  }else if(choice==='3'){
    const data = JSON.stringify({startDate:state.startDate, done:state.done, notes:state.notes, diet:state.diet}, null, 2);
    prompt('Copia este texto y guárdalo. Para restaurar usa "Importar".', data);
  }else if(choice==='4'){
    const data = prompt('Pega aquí el JSON de la copia de seguridad:', '');
    if(!data) return;
    try{
      const obj = JSON.parse(data);
      if(obj.startDate) state.startDate = obj.startDate;
      if(obj.done) state.done = obj.done;
      if(obj.notes) state.notes = obj.notes;
      if(obj.diet) state.diet = obj.diet;
      saveState(); render();
      alert('Copia restaurada con éxito.');
    }catch(e){ alert('JSON no válido.'); }
  }else if(choice==='5'){
    if(state.user){
      if(confirm('¿Cerrar sesión? Tu progreso ya está guardado en la nube. Se borrará el caché local de este dispositivo.')){
        signOut().then(render);
      }
    }else{
      state.guestMode=false; state.loginSent=false; saveLocal(); render();
    }
  }else if(choice==='6'){
    if(confirm('¿Borrar todo el progreso de este dispositivo?\n\nSi tienes cuenta, los datos siguen en la nube y se restaurarán al iniciar sesión.')){
      state.startDate=null; state.done={}; state.notes={}; state.diet={}; state.view='home';
      saveLocal();
      if(state.user) pushToCloud(); // reflejar el borrado en la nube
      render();
    }
  }
}

/* persistencia defensiva: guardar si la pestaña pasa a segundo plano */
window.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveState(); });
window.addEventListener('beforeunload', saveState);

/* ─── navegación ──────────────────────────────────────────────── */
function goSession(w, s){
  state.weekIdx = w;
  state.sessionIdx = s;
  state.view = 'session';
  render();
}

/* ─── celebración ─────────────────────────────────────────────── */
function showCelebrate(emoji, title, text){
  $('#celebrate-emoji').textContent = emoji;
  $('#celebrate-title').textContent = title;
  $('#celebrate-text').textContent = text;
  $('#celebrate').classList.add('show');
}
function hideCelebrate(){ $('#celebrate').classList.remove('show'); }

function onSessionComplete(w, s){
  // celebración por sesión, semana o plan
  const wp = weekProgress(w);
  const totDone = totalDone();
  const totAll = totalSessions();
  setTimeout(()=>{
    if(totDone===totAll){
      showCelebrate('🏆','¡Plan completado!','24 semanas. Estás listo para el Camino.');
    }else if(wp.complete){
      const week = PLAN[w];
      if(week.isObjective) showCelebrate('🎯','¡Objetivo cumplido!','Has completado una semana clave del plan.');
      else if(week.isDeload) showCelebrate('🌿','Deload completado','Cuerpo recuperado, listo para la siguiente fase.');
      else if(week.isTaper) showCelebrate('🏁','Tapering completo','Mañana empieza el Camino. Estás listo.');
      else showCelebrate('🔥', `Semana ${w+1} completa`, '3 de 3 sesiones. Adelante con la siguiente.');
    }else{
      showCelebrate('✅','Sesión completada', `${wp.done} de ${wp.total} esta semana.`);
    }
  }, 80);
}

/* ─── utils ───────────────────────────────────────────────────── */
function capitalize(s){ return s ? s[0].toUpperCase()+s.slice(1) : s; }

/* ─── boot ────────────────────────────────────────────────────── */
loadLocal();
render(); // pinta el estado bootstrapping
initAuth().then(render);

// reaccionar a cambios de conectividad
window.addEventListener('online', ()=>{ if(state.user){ pushToCloud(); } });
window.addEventListener('offline', ()=>{ state.syncStatus='offline'; updateSyncBadge(); });
</script>
